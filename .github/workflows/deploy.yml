name: Deploy Backend

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build Linux binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o myapp-backend ./cmd/main.go
          gzip -9 -c myapp-backend > myapp-backend.gz
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o almak-backup ./cmd/backup
          ls -lh myapp-backend myapp-backend.gz

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat << 'EOF' > ~/.ssh/known_hosts
          ${{ secrets.KNOWN_HOSTS }}
          EOF
          chmod 644 ~/.ssh/known_hosts

      - name: Upload binary
        timeout-minutes: 5
        run: |
          rsync -av --partial --timeout=120 --info=progress2 -e "ssh -i ~/.ssh/id_ed25519" \
            ./myapp-backend.gz ./almak-backup \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/tmp/

      - name: Back up PostgreSQL before migrations
        timeout-minutes: 10
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} 'bash -s' <<'EOF'
          set -euo pipefail
          umask 077
          staging=$(mktemp -d)
          trap 'rm -f -- "$staging/.env" /tmp/almak-backup; rmdir -- "$staging"' EXIT
          workdir=$(systemctl show myapp-backend --property=WorkingDirectory --value)
          config="$workdir/.env"
          if [ ! -f "$config" ]; then
            read -r config _ <<< "$(systemctl show myapp-backend --property=EnvironmentFiles --value)"
          fi
          test -f "$config"
          sudo -n /usr/bin/rsync -a --numeric-ids --chmod=F600 --chown="$(id -u):$(id -g)" "$config" "$staging/.env"
          install -d -m 700 "$HOME/almak-backups"
          cd "$staging"
          /tmp/almak-backup "$HOME/almak-backups"
          EOF

      - name: Configure AI provider on server
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: python3 scripts/provision_ai_env.py

      - name: Deploy on server
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} 'bash -s' <<'EOF'
          set -euo pipefail

          gzip -dc /tmp/myapp-backend.gz > /tmp/myapp-backend
          sudo mv /tmp/myapp-backend /opt/myapp/backend/myapp-backend
          rm -f /tmp/myapp-backend.gz
          sudo chown myapp:myapp /opt/myapp/backend/myapp-backend
          sudo chmod 750 /opt/myapp/backend/myapp-backend
          sudo systemctl daemon-reload
          sudo systemctl restart myapp-backend
          sudo systemctl status myapp-backend --no-pager
          EOF
