name: CI

on:
  pull_request:
    branches: ["main"]

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: almak_test_roles
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-test-password
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ALMAK_TEST_DATABASE_URL: host=127.0.0.1 port=5432 user=postgres password=isolated-test-password dbname=almak_test_roles sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: |
            go.sum

      - name: Tidy
        run: go mod tidy

      - name: Test
        run: go test ./...

      - name: Test deployment environment provisioning
        run: python3 scripts/test_provision_ai_env.py

      - name: Test user provisioning
        run: python3 scripts/test_provision_team.py

      - name: Build
        run: go build -o app ./cmd
