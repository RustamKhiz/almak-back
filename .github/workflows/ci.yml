name: CI

on:
  pull_request:
    branches: ["main"]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: |
            go.sum

      - name: Tidy
        run: go mod tidy

      - name: Test
        run: go test ./...

      - name: Test deployment environment provisioning
        run: python3 scripts/test_provision_ai_env.py

      - name: Build
        run: go build -o app ./cmd
